services:
  mysql:
    image: mysql:8.4
    container_name: medilink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: medilink_root
      MYSQL_DATABASE: medilink
      MYSQL_USER: medilink
      MYSQL_PASSWORD: medilink_dev
    ports:
      - "3307:3306"
    volumes:
      - medilink-mysql:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmedilink_root"]
      interval: 5s
      retries: 20

volumes:
  medilink-mysql:
